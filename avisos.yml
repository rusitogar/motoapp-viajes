name: Avisos (viaje nuevo / se detuvo)

# Corre cada ~5 minutos. Manda notificaciones push:
#  - cuando un favorito crea un viaje
#  - cuando alguien del grupo se detiene mucho tiempo o manda un SOS
# El envío usa la cuenta de servicio de Firebase (secret FIREBASE_SERVICE_ACCOUNT).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install firebase-admin@^13 --no-save --no-audit --no-fund
      - run: node scripts/avisos.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
