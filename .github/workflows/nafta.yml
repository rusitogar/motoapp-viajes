name: Actualizar precio nafta

on:
  schedule:
    - cron: "0 12 1 * *" # día 1 de cada mes, 12:00 UTC (~09:00 Argentina)
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/actualizarnafta.mjs
      - name: Commitear si cambió
        run: |
          if ! git diff --quiet nafta.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add nafta.json
            git commit -m "Precio nafta súper: actualización automática"
            git push
          else
            echo "Sin cambios"
          fi
